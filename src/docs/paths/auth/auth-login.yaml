paths:
  /api/auth/login:
    post:
      summary: Login user
      tags:
        - Auth

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'

      responses:
        200:
          description: Login successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'

        400:
          description: Invalid credentials

        401:
          description: Unauthorized