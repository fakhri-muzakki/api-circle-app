paths:
  /api/threads/{id}:
    get:
      summary: Get thread detail with replies
      tags:
        - Threads
      security:
        - bearerAuth: []

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            example: "019d8aac-6085-7c55-bb86-46d3fb232e7b"

      responses:
        200:
          description: Fetched thread with replies successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetThreadDetailResponse'

        401:
          description: Unauthorized

        404:
          description: Thread not found