paths:
  /api/follows:
    post:
      summary: Create follow
      tags:
        - Follows
      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFollowRequest'

      responses:
        201:
          description: Created follow successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateFollowResponse'

        400:
          description: Bad request

        401:
          description: Unauthorized

        409:
          description: Already following