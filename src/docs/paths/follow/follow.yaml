paths:
  /api/follows/{id}:
    delete:
      summary: Delete follow
      tags:
        - Follows
      security:
        - bearerAuth: []

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            example: "326c4439-8bbc-44e6-9b94-51d07ec2155f"

      responses:
        200:
          description: Deleted follow successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteFollowResponse'

        401:
          description: Unauthorized

        404:
          description: Follow not found